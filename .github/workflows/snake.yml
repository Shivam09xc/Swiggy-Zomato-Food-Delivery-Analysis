name: Generate Snake Animation

on:
  schedule:
    # Run once every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates a snake game from a github user contribution graph, outputting SVGs
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shivam09xc
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#00F7FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?palette=github-light&color_snake=#7F00FF&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      # Push the content of <build_dir> to a target branch
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
